<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>福医卒中通 · 脑卒中智能诊疗助手</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--font-scale:1}
        body{background:linear-gradient(135deg,#f0f7ff,#e6f4fd);padding:20px;min-height:100vh;font-size:calc(16px * var(--font-scale));padding-bottom:90px;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
        .container{max-width:1000px;margin:0 auto}
        header{text-align:center;margin-bottom:20px}
        header h1{font-size:calc(56px * var(--font-scale));color:#0077cc;letter-spacing:2px}
        header p{color:#666;font-size:calc(28px * var(--font-scale));margin-top:5px}
        .main-card{background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(0,100,200,0.08);display:flex;flex-direction:column;height:calc(100vh - 40px - 90px);overflow:hidden}
        .chat-header-bar{background:linear-gradient(90deg,#0077cc,#0099ee);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
        .chat-header-bar h2{font-size:calc(32px * var(--font-scale));font-weight:600}
        .header-btns{display:flex;gap:8px;position:relative}
        .header-btn{padding:6px 12px;border-radius:20px;background:rgba(255,255,255,0.2);color:#fff;border:none;font-size:calc(26px * var(--font-scale));cursor:pointer;transition:background 0.2s}
        .header-btn:hover{background:rgba(255,255,255,0.35)}
        .chat-content{display:flex;flex:1;overflow:hidden}
        .sidebar{width:240px;background:#f8fcff;border-right:1px solid #e6f7ff;padding:30px 20px;display:flex;flex-direction:column;justify-content:center}
        .avatar-box{width:120px;height:120px;margin:0 auto 10px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 15px rgba(0,119,204,0.15);overflow:hidden;cursor:pointer;position:relative;transition:box-shadow 0.2s}
        .avatar-box:hover{box-shadow:0 6px 20px rgba(0,119,204,0.35)}
        .avatar-box.patient{box-shadow:0 4px 15px rgba(84,153,199,0.15)}
        .avatar-box.patient:hover{box-shadow:0 6px 20px rgba(84,153,199,0.4)}
        .avatar-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden}
        .change-hint{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);background:rgba(0,119,204,0.85);color:#fff;font-size:12px;padding:2px 12px;border-radius:12px;opacity:0;transition:opacity 0.2s;pointer-events:none;white-space:nowrap}
        .avatar-box:hover .change-hint{opacity:1}
        .avatar-card{text-align:center;margin-bottom:40px}
        .avatar-card h3{font-size:calc(28px * var(--font-scale));color:#333;font-weight:600}
        .chat-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
        .quick-questions{padding:12px 16px;background:#f5f9fe;border-bottom:1px solid #e6f0fa;overflow-x:auto;white-space:nowrap;display:flex;gap:10px}
        .quick-questions button{background:#eef3fc;border:1px solid #cce4f5;border-radius:24px;padding:8px 16px;font-size:calc(24px * var(--font-scale));color:#0077cc;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all 0.2s}
        .quick-questions button:hover{background:#0077cc;color:#fff;border-color:#0077cc}
        .chat-body{flex:1;padding:20px;overflow-y:auto;background:#fafbfc}
        .message{display:flex;gap:10px;margin-bottom:14px;max-width:75%}
        .message.user{margin-left:auto;flex-direction:row-reverse}
        .msg-avatar{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.05);flex-shrink:0;overflow:hidden;cursor:pointer;transition:box-shadow 0.2s}
        .msg-avatar:hover{box-shadow:0 2px 10px rgba(0,119,204,0.35)}
        .msg-bubble{padding:12px 16px;border-radius:14px;background:#fff;border:1px solid #eee;line-height:1.5;font-size:calc(28px * var(--font-scale));word-break:break-word;box-shadow:0 2px 8px rgba(0,0,0,0.03)}
        .message.user .msg-bubble{background:#0077cc;color:#fff;border:none}
        /* 自定义头像图片样式 */
        .msg-avatar img,.avatar-inner img,.avatar-preview img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
        .chat-footer{position:fixed;bottom:0;left:0;width:100%;padding:14px 20px;border-top:1px solid #eee;display:flex;gap:10px;background:#fff;z-index:99;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
        .chat-input{flex:1;padding:10px 16px;border:1px solid #ddd;border-radius:24px;outline:none;font-size:calc(28px * var(--font-scale));transition:border-color 0.2s}
        .chat-input:focus{border-color:#0077cc}
        .send-btn,.clear-btn{padding:10px 18px;border-radius:24px;background:#0077cc;color:#fff;border:none;font-size:calc(28px * var(--font-scale));cursor:pointer;transition:background 0.2s}
        .send-btn:hover{background:#005fa3}
        .clear-btn{background:#777}
        .clear-btn:hover{background:#555}
        .mic-btn{width:38px;height:38px;border-radius:50%;background:#0077cc;color:#fff;font-size:calc(32px * var(--font-scale));border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .mic-btn.recording{background:#e53935;animation:pulse 1s infinite}
        @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
        .font-modal{position:absolute;top:60px;right:0;background:#fff;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,0.15);padding:15px;z-index:1000;display:none;min-width:280px}
        .font-modal.show{display:block}
        /* ===== 头像设置弹窗样式 ===== */
        .avatar-modal-mask{position:fixed;inset:0;background:rgba(0,30,60,0.45);display:none;align-items:center;justify-content:center;z-index:2000;padding:16px}
        .avatar-modal-mask.show{display:flex}
        .avatar-modal{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:22px 24px;box-shadow:0 12px 40px rgba(0,60,120,0.25)}
        .avatar-modal-title{font-size:22px;color:#0077cc;font-weight:600;text-align:center}
        .avatar-modal-tip{font-size:12px;color:#999;text-align:center;margin:6px 0 14px;line-height:1.6}
        .avatar-modal-body{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
        .avatar-setting-block{flex:1;min-width:240px;background:#f8fcff;border:1px solid #e6f7ff;border-radius:12px;padding:16px;text-align:center}
        .avatar-setting-block h4{font-size:calc(24px * var(--font-scale));color:#333;margin-bottom:10px}
        .avatar-preview{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;overflow:hidden;box-shadow:0 4px 12px rgba(0,119,204,0.18);display:flex;align-items:center;justify-content:center;background:#fff}
        .avatar-preview svg{width:78px;height:78px}
        .preset-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
        .preset-item{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;border:2px solid transparent;transition:transform 0.15s,border-color 0.15s;user-select:none}
        .preset-item:hover{transform:scale(1.12)}
        .preset-item.selected{border-color:#0077cc;box-shadow:0 0 0 3px rgba(0,119,204,0.2)}
        .avatar-ops{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
        .op-btn{padding:8px 14px;border-radius:20px;border:1px solid #cce4f5;background:#eef3fc;color:#0077cc;font-size:14px;cursor:pointer;transition:all 0.2s}
        .op-btn:hover{background:#d8ecfa}
        .op-btn.primary{background:#0077cc;color:#fff;border-color:#0077cc}
        .op-btn.primary:hover{background:#005fa3}
        .close-btn{display:block;margin:16px auto 0;background:#0077cc;color:#fff;border-color:#0077cc;padding:8px 34px}
        @media (max-width:768px){.sidebar{display:none}.chat-main{width:100%}}
    </style>
</head>
<body>
<div class="container">
    <header><h1>福医卒中通</h1><p>脑卒中智能诊疗助手</p></header>
    <div class="main-card">
        <div class="chat-header-bar">
            <h2>脑卒中智能咨询</h2>
            <div class="header-btns">
                <button class="header-btn" id="langBtn">切换英文</button>
                <button class="header-btn" id="fontBtn">字体调节</button>
                <button class="header-btn" id="voiceBtn">语音播报：开</button>
                <div class="font-modal" id="fontModal">
                    <div class="modal-title">字体大小调节</div>
                    <div class="opt-group">
                        <button class="opt-btn" id="enlargeBtn">放大</button>
                        <button class="opt-btn" id="narrowBtn">缩小</button>
                    </div>
                    <div class="input-group">
                        <input type="number" id="scaleInput" step="0.5" value="">
                    </div>
                    <button class="confirm-btn" id="confirmFontBtn">确认调节</button>
                    <div class="tip-text">放大1-4 缩小0.3-1</div>
                </div>
            </div>
        </div>
        <div class="chat-content">
            <div class="sidebar">
                <div class="avatar-card">
                    <div class="avatar-box" id="doctorAvatarClick" title="点击更换头像">
                        <div class="avatar-inner" id="doctorAvatarBox"></div>
                        <div class="change-hint">📷 更换头像</div>
                    </div>
                    <h3>福医卒中通助手</h3>
                </div>
                <div class="avatar-card">
                    <div class="avatar-box patient" id="patientAvatarClick" title="点击更换头像">
                        <div class="avatar-inner" id="patientAvatarBox"></div>
                        <div class="change-hint">📷 更换头像</div>
                    </div>
                    <h3>咨询患者</h3>
                </div>
            </div>
            <div class="chat-main">
                <div class="quick-questions">
                    <button id="quick1">高血压怎么预防中风？</button><button id="quick2">中风后吃什么好？</button><button id="quick3">家人中风后怎么照顾？</button><button id="quick4">怎么判断是不是中风？</button><button id="quick5">中风后手脚没力气怎么办？</button><button id="quick6">中风后情绪低落怎么办？</button><button id="quick7">中风康复训练有哪些？</button><button id="quick8">颈动脉斑块需要治疗吗？</button><button id="quick9">中风后可以运动吗？</button><button id="quick10">怎么帮家人做心理疏导？</button>
                </div>
                <div class="chat-body" id="chatBody"></div>
            </div>
        </div>
    </div>
</div>
<div class="chat-footer">
    <input class="chat-input" id="input" placeholder="问脑卒中相关问题：预防、康复、养护、心理支持...">
    <button class="mic-btn" id="micBtn">🎤</button>
    <button class="send-btn" id="sendBtn">发送</button>
    <button class="send-btn clear-btn" id="clearBtn">清空</button>
</div>

<!-- ===== 头像设置弹窗 ===== -->
<div class="avatar-modal-mask" id="avatarModalMask">
    <div class="avatar-modal" role="dialog" aria-label="头像设置">
        <div class="avatar-modal-title">🎨 头像设置</div>
        <p class="avatar-modal-tip">点击侧边栏或聊天中的头像也可打开此窗口<br>自定义头像仅保存在本机浏览器中，支持 jpg / png / webp 等常见图片格式</p>
        <div class="avatar-modal-body">
            <div class="avatar-setting-block">
                <h4>助手头像（医生）</h4>
                <div class="avatar-preview" id="doctorPreviewBox"></div>
                <div class="preset-row" id="doctorPresetRow"></div>
                <div class="avatar-ops">
                    <button class="op-btn primary" id="doctorUploadBtn">📤 上传自定义</button>
                    <button class="op-btn" id="doctorResetBtn">↺ 恢复默认</button>
                </div>
                <input type="file" id="doctorFileInput" accept="image/*" style="display:none">
            </div>
            <div class="avatar-setting-block">
                <h4>患者头像（我）</h4>
                <div class="avatar-preview" id="patientPreviewBox"></div>
                <div class="preset-row" id="patientPresetRow"></div>
                <div class="avatar-ops">
                    <button class="op-btn primary" id="patientUploadBtn">📤 上传自定义</button>
                    <button class="op-btn" id="patientResetBtn">↺ 恢复默认</button>
                </div>
                <input type="file" id="patientFileInput" accept="image/*" style="display:none">
            </div>
        </div>
        <button class="op-btn close-btn" id="avatarModalClose">完 成</button>
    </div>
</div>

<script>
let lang = "zh", voiceEnabled = true, fontOpt = "enlarge", isRecording = false, recognition = null;
const synth = window.speechSynthesis;

// ===== 头像状态（localStorage 持久化） =====
const avatars = {
    patient: localStorage.getItem('fyyzt_avatar_patient') || '',
    doctor:  localStorage.getItem('fyyzt_avatar_doctor')  || ''
};

// 预设头像：[表情, 背景色]
const PRESET_DOCTOR  = [['🧑‍⚕️','#E6F7FF'],['👩‍⚕️','#FCE4EC'],['👨‍⚕️','#E8F5E9'],['🩺','#FFF8E1'],['🤖','#EDE7F6'],['📖','#E0F7FA'],['🌟','#FFFDE7'],['🫀','#FFEBEE']];
const PRESET_PATIENT = [['🙂','#E8F5E9'],['😊','#FFF8E1'],['👴','#EDE7F6'],['👵','#FCE4EC'],['🧑','#E0F7FA'],['👩','#F3E5F5'],['👨','#E3F2FD'],['🌻','#FFFDE7']];

function presetDataURI(emoji, bg){
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="${bg}"/><text x="50" y="56" font-size="52" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif">${emoji}</text></svg>`;
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

// 精美医生小头像（聊天框默认）
const doctorAvatar = `<svg viewBox="0 0 44 44" width="44" height="44"><circle cx="22" cy="22" r="22" fill="#E6F7FF"/><path d="M10,44 L10,30 C10,25 18,22 22,22 C26,22 34,25 34,30 L34,44 Z" fill="#fff" stroke="#0077cc" stroke-width="1"/><path d="M16,22 L22,30 L28,22 Z" fill="#0077cc"/><circle cx="22" cy="16" r="10" fill="#FFDAB9"/><path d="M12,16 C12,8 32,8 32,16 C32,12 28,10 22,10 C16,10 12,12 12,16 Z" fill="#4A4A4A"/><circle cx="17" cy="17" r="1.5" fill="#333"/><circle cx="27" cy="17" r="1.5" fill="#333"/><path d="M19,21 Q22,23 25,21" fill="none" stroke="#D35B6B" stroke-width="1.5" stroke-linecap="round"/></svg>`;

// 精美患者小头像（聊天框默认）
const patientAvatar = `<svg viewBox="0 0 44 44" width="44" height="44"><circle cx="22" cy="22" r="22" fill="#F0F9FF"/><path d="M10,44 L10,30 C10,25 18,22 22,22 C26,22 34,25 34,30 L34,44 Z" fill="#F0F9FF" stroke="#5499c7" stroke-width="1"/><circle cx="22" cy="16" r="10" fill="#FFDAB9"/><path d="M12,16 C12,8 32,8 32,16 C32,12 28,10 22,10 C16,10 12,12 12,16 Z" fill="#BBBBBB"/><circle cx="17" cy="17" r="3" fill="none" stroke="#333" stroke-width="1"/><circle cx="27" cy="17" r="3" fill="none" stroke="#333" stroke-width="1"/><line x1="20" y1="17" x2="24" y2="17" stroke="#333" stroke-width="1"/><circle cx="17" cy="17" r="1" fill="#333"/><circle cx="27" cy="17" r="1" fill="#333"/><path d="M19,21 Q22,23 25,21" fill="none" stroke="#D35B6B" stroke-width="1.5" stroke-linecap="round"/></svg>`;

// 侧边栏大号默认头像
const doctorAvatarLarge = `<svg viewBox="0 0 120 120" width="100" height="100"><defs><linearGradient id="docSkin" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFDAB9"/><stop offset="100%" stop-color="#F4A89F"/></linearGradient><linearGradient id="docCoat" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F0F7FF"/></linearGradient><linearGradient id="docBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E6F7FF"/><stop offset="100%" stop-color="#C1E3FF"/></linearGradient></defs><circle cx="60" cy="60" r="58" fill="url(#docBg)" stroke="#0077cc" stroke-width="2"/><path d="M20,120 L20,85 C20,65 45,55 60,55 C75,55 100,65 100,85 L100,120 Z" fill="url(#docCoat)" stroke="#0077cc" stroke-width="1.5"/><path d="M45,55 L60,75 L75,55 L70,50 L60,65 L50,50 Z" fill="#0077cc"/><path d="M50,55 L50,65 C50,70 70,70 70,65 L70,55 Z" fill="url(#docSkin)"/><ellipse cx="60" cy="40" rx="22" ry="25" fill="url(#docSkin)"/><path d="M38,40 C38,18 82,18 82,40 C82,30 75,25 60,25 C45,25 38,30 38,40 Z" fill="#4A4A4A"/><path d="M50,42 Q55,45 60,42" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/><path d="M60,42 Q65,45 70,42" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/><circle cx="45" cy="48" r="4" fill="#FFC0CB" opacity="0.5"/><circle cx="75" cy="48" r="4" fill="#FFC0CB" opacity="0.5"/><path d="M53,52 Q60,56 67,52" fill="none" stroke="#D35B6B" stroke-width="2" stroke-linecap="round"/><path d="M40,70 C40,85 50,95 55,90 M80,70 C80,85 70,95 65,90" fill="none" stroke="#00558b" stroke-width="2.5"/><circle cx="60" cy="90" r="6" fill="#00558b" stroke="#333" stroke-width="1"/><circle cx="60" cy="90" r="3" fill="#A0C8E0"/></svg>`;

const patientAvatarLarge = `<svg viewBox="0 0 120 120" width="100" height="100"><defs><linearGradient id="patSkin" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFDAB9"/><stop offset="100%" stop-color="#F4A89F"/></linearGradient><linearGradient id="patClothes" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#F0F9FF"/><stop offset="100%" stop-color="#C6E7FF"/></linearGradient><linearGradient id="patBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F0F9FF"/><stop offset="100%" stop-color="#D4E6FF"/></linearGradient></defs><circle cx="60" cy="60" r="58" fill="url(#patBg)" stroke="#5499c7" stroke-width="2"/><path d="M20,120 L20,85 C20,65 45,55 60,55 C75,55 100,65 100,85 L100,120 Z" fill="url(#patClothes)" stroke="#5499c7" stroke-width="1.5"/><path d="M25,100 L95,100 M25,110 L95,110" stroke="#A0C8E0" stroke-width="2" stroke-dasharray="4,4"/><path d="M50,55 L50,65 C50,70 70,70 70,65 L70,55 Z" fill="url(#patSkin)"/><ellipse cx="60" cy="40" rx="22" ry="25" fill="url(#patSkin)"/><path d="M38,40 C38,18 82,18 82,40 C82,30 75,25 60,25 C45,25 38,30 38,40 Z" fill="#BBBBBB"/><path d="M38,35 C40,25 50,22 50,22 C40,30 40,40 40,40 Z" fill="#AAAAAA"/><path d="M82,35 C80,25 70,22 70,22 C80,30 80,40 80,40 Z" fill="#AAAAAA"/><circle cx="50" cy="42" r="6" fill="none" stroke="#333" stroke-width="1.5"/><circle cx="70" cy="42" r="6" fill="none" stroke="#333" stroke-width="1.5"/><line x1="56" y1="42" x2="64" y2="42" stroke="#333" stroke-width="1.5"/><circle cx="50" cy="42" r="2" fill="#333"/><circle cx="70" cy="42" r="2" fill="#333"/><path d="M53,52 Q60,55 67,52" fill="none" stroke="#D35B6B" stroke-width="2" stroke-linecap="round"/><circle cx="43" cy="48" r="4" fill="#FFC0CB" opacity="0.5"/><circle cx="77" cy="48" r="4" fill="#FFC0CB" opacity="0.5"/></svg>`;

// ===== 头像核心逻辑 =====
function getAvatarHTML(role, large){
    if(avatars[role]) return `<img src="${avatars[role]}" alt="${role==='patient'?'患者':'医生'}头像">`;
    if(large) return role==='patient' ? patientAvatarLarge : doctorAvatarLarge;
    return role==='patient' ? patientAvatar : doctorAvatar;
}
function refreshAvatars(){
    const d=getEl('doctorAvatarBox'), p=getEl('patientAvatarBox');
    if(d) d.innerHTML=getAvatarHTML('doctor', true);
    if(p) p.innerHTML=getAvatarHTML('patient', true);
    document.querySelectorAll('.message.user .msg-avatar').forEach(el=>{ el.innerHTML=getAvatarHTML('patient'); });
    document.querySelectorAll('.message.assistant .msg-avatar').forEach(el=>{ el.innerHTML=getAvatarHTML('doctor'); });
}
function openAvatarModal(){ renderAvatarModal(); getEl('avatarModalMask')?.classList.add('show'); }
function closeAvatarModal(){ getEl('avatarModalMask')?.classList.remove('show'); }
function renderAvatarModal(){
    ['patient','doctor'].forEach(role=>{
        const preview=getEl(role+'PreviewBox');
        if(preview) preview.innerHTML=getAvatarHTML(role, true);
        const row=getEl(role+'PresetRow');
        if(row){
            row.innerHTML='';
            const list = role==='patient' ? PRESET_PATIENT : PRESET_DOCTOR;
            list.forEach(([emoji,bg])=>{
                const uri=presetDataURI(emoji,bg);
                const item=document.createElement('div');
                item.className='preset-item'+(avatars[role]===uri?' selected':'');
                item.style.background=bg;
                item.textContent=emoji;
                item.title='使用该头像';
                item.addEventListener('click',()=>{
                    avatars[role]=uri;
                    try{ localStorage.setItem('fyyzt_avatar_'+role, uri); }catch(e){}
                    refreshAvatars(); renderAvatarModal();
                });
                row.appendChild(item);
            });
        }
    });
}
function processAndStoreImage(file, role){
    if(!file.type || !file.type.startsWith('image/')){ alert('请选择图片文件（jpg / png 等）'); return; }
    if(file.size > 15*1024*1024){ alert('图片太大，请选择 15MB 以内的图片'); return; }
    const reader=new FileReader();
    reader.onload=e=>{
        const img=new Image();
        img.onload=()=>{
            try{
                const size=240, canvas=document.createElement('canvas');
                canvas.width=size; canvas.height=size;
                const ctx=canvas.getContext('2d');
                ctx.fillStyle='#fff'; ctx.fillRect(0,0,size,size);
                const min=Math.min(img.width,img.height);
                ctx.drawImage(img,(img.width-min)/2,(img.height-min)/2,min,min,0,0,size,size);
                const dataUrl=canvas.toDataURL('image/jpeg',0.88);
                localStorage.setItem('fyyzt_avatar_'+role, dataUrl);
                avatars[role]=dataUrl;
                refreshAvatars(); renderAvatarModal();
            }catch(err){ alert('头像处理失败，请换一张图片试试'); console.error(err); }
        };
        img.onerror=()=>alert('图片读取失败，请换一张图片');
        img.src=e.target.result;
    };
    reader.readAsDataURL(file);
}
function bindAvatarControls(role){
    const input=getEl(role+'FileInput');
    input?.addEventListener('change',()=>{
        const file=input.files && input.files[0];
        if(file) processAndStoreImage(file, role);
        input.value='';
    });
    getEl(role+'UploadBtn')?.addEventListener('click',()=>input?.click());
    getEl(role+'ResetBtn')?.addEventListener('click',()=>{
        avatars[role]='';
        localStorage.removeItem('fyyzt_avatar_'+role);
        refreshAvatars(); renderAvatarModal();
    });
}

function getEl(id){ return document.getElementById(id); }
function selectOpt(opt){
    fontOpt=opt; let enlargeBtn=getEl('enlargeBtn'), narrowBtn=getEl('narrowBtn');
    if(enlargeBtn) enlargeBtn.className=opt==='enlarge'?'opt-btn active':'opt-btn';
    if(narrowBtn) narrowBtn.className=opt==='narrow'?'opt-btn active':'opt-btn';
    let si=getEl('scaleInput'); if(si){
        if(opt==='enlarge'){ si.min=1; si.max=4; si.step=0.5; si.placeholder="1-4"; }
        else{ si.min=0.3; si.max=1; si.step=0.1; si.placeholder="0.3-1"; }
        si.value=""; si.focus();
    }
}
function adjustFont(){
    let si=getEl('scaleInput'); if(!si) return;
    let v=parseFloat(si.value.trim()); if(isNaN(v)||v<=0) v=1;
    if(fontOpt==='enlarge') v=Math.min(4,Math.max(1,v)); else v=Math.min(1,Math.max(0.3,v));
    document.documentElement.style.setProperty('--font-scale', v); si.value=v; closeFontModal();
}
function openFontModal(){ let modal=getEl('fontModal'); if(modal) modal.classList.add('show'); let si=getEl('scaleInput'); if(si) si.focus(); }
function closeFontModal(){ let modal=getEl('fontModal'); if(modal) modal.classList.remove('show'); selectOpt('enlarge'); }
function initRecognition(){
    if(!window.SpeechRecognition && !window.webkitSpeechRecognition){ alert("浏览器不支持语音输入"); return false; }
    const Rec=window.SpeechRecognition||window.webkitSpeechRecognition; recognition=new Rec();
    recognition.lang=lang==='zh'?'zh-CN':'en-US'; recognition.interimResults=false; recognition.continuous=false;
    recognition.onresult=(e)=>{ let txt=e.results[0][0].transcript; let inp=getEl('input'); if(inp) inp.value=txt; stopRec(); };
    recognition.onerror=stopRec; recognition.onend=stopRec; return true;
}
function toggleRec(){
    if(!recognition && !initRecognition()) return;
    isRecording=!isRecording; let btn=getEl('micBtn'); if(btn) btn.classList.toggle('recording');
    if(isRecording){ try{ recognition.start(); }catch(e){ stopRec(); alert("麦克风启动失败"); } }
    else{ recognition.stop(); }
}
function stopRec(){ isRecording=false; let btn=getEl('micBtn'); if(btn) btn.classList.remove('recording'); if(recognition) recognition.stop(); }
function toggleVoice(){
    voiceEnabled=!voiceEnabled; let btn=getEl('voiceBtn'); if(btn) btn.innerText="语音播报："+(voiceEnabled?"开":"关");
    if(!voiceEnabled) synth.cancel(); else{ let last=getLastAssistantMessage(); if(last) speak(last); }
}
function getLastAssistantMessage(){ let msgs=document.querySelectorAll('.message.assistant .msg-bubble'); if(msgs.length) return msgs[msgs.length-1].innerText.trim(); return null; }
function speak(t){ if(!voiceEnabled||!t) return; synth.cancel(); let u=new SpeechSynthesisUtterance(t); u.lang=lang==='zh'?'zh-CN':'en-US'; synth.speak(u); }
async function switchLang(){
    lang=lang==='zh'?'en':'zh'; await fetch("/api/switch_lang",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lang})}).catch(e=>console.log);
    let btn=getEl('langBtn'); if(btn) btn.innerText=lang==='zh'?"切换英文":"切换中文"; clearChat();
}
function addMsg(role, text){
    let body=getEl('chatBody'); if(!body) return;
    let div=document.createElement('div'); div.className='message '+role;
    let avatar=role==='user'?getAvatarHTML('patient'):getAvatarHTML('doctor');
    let cleaned=text.replace(/\*\*/g, '');
    div.innerHTML = `<div class="msg-avatar" title="点击更换头像">${avatar}</div><div class="msg-bubble">${cleaned.replace(/\n/g, '<br>')}</div>`;
    body.appendChild(div); body.scrollTop=body.scrollHeight;
}
function clearChat(){
    let body=getEl('chatBody'); if(!body) return;
    let welcome=lang==='zh'
        ? '你好！我是脑卒中智能助手，可咨询预防、康复、养护、心理支持等问题~\n💡 小贴士：点击任意头像可以更换头像哦！'
        : "Hello! I'm stroke assistant~\n💡 Tip: Click any avatar to change it!";
    body.innerHTML=`<div class="message"><div class="msg-avatar" title="点击更换头像">${getAvatarHTML('doctor')}</div><div class="msg-bubble">${welcome.replace(/\n/g,'<br>')}</div></div>`;
}
async function send(){
    let inp=getEl('input'); if(!inp) return; let text=inp.value.trim(); if(!text) return;
    addMsg('user',text); inp.value='';
    let loading=document.createElement('div'); loading.className='message assistant loading-message'; loading.innerHTML=`<div class="msg-avatar" title="点击更换头像">${getAvatarHTML('doctor')}</div><div class="msg-bubble">🤔 思考中...</div>`;
    let chatBody=getEl('chatBody'); if(chatBody) chatBody.appendChild(loading); if(chatBody) chatBody.scrollTop=chatBody.scrollHeight;
    try{
        const response = await fetch('/api/stream', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: text }) });
        if(loading) loading.remove();
        const assistantDiv = document.createElement('div'); assistantDiv.className = 'message assistant'; assistantDiv.innerHTML = `<div class="msg-avatar" title="点击更换头像">${getAvatarHTML('doctor')}</div><div class="msg-bubble"></div>`;
        if(chatBody) chatBody.appendChild(assistantDiv);
        const bubble = assistantDiv.querySelector('.msg-bubble');
        let full = '';
        const reader = response.body.getReader(); const decoder = new TextDecoder(); let buffer = '';
        while (true) {
            const { done, value } = await reader.read(); if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n\n'); buffer = lines.pop();
            for (const line of lines) {
                if (line.startsWith('data: ')) {
                    const jsonStr = line.slice(6);
                    try {
                        const data = JSON.parse(jsonStr);
                        if (data.chunk !== undefined) {
                            full += data.chunk;
                            bubble.innerHTML = full.replace(/\n/g, '<br>');
                            if(chatBody) chatBody.scrollTop = chatBody.scrollHeight;
                        }
                    } catch(e) { console.error(e); }
                }
            }
        }
        if (voiceEnabled && full) speak(full);
    }catch(err){
        if(loading) loading.remove();
        addMsg('assistant','抱歉，网络错误，请稍后再试。'); console.error(err);
    }
}
function quickAsk(q){ let inp=getEl('input'); if(inp) inp.value=q; send(); }

(function(){ if(window.innerWidth<=768){ function apply(){ let sidebar=document.querySelector('.sidebar'), chatMain=document.querySelector('.chat-main'), chatContent=document.querySelector('.chat-content'); if(sidebar) sidebar.style.display='none'; if(chatMain){ chatMain.style.width='100%'; chatMain.style.flex='1'; } if(chatContent){ chatContent.style.display='flex'; chatContent.style.flexDirection='row'; } let style=document.createElement('style'); style.textContent=`body header{margin-bottom:8px!important}body header h1{font-size:24px!important;margin-bottom:2px!important}body header p{font-size:12px!important;display:none!important}body .chat-header-bar{padding:8px 12px!important}body .chat-header-bar h2{font-size:18px!important}body .header-btn{font-size:12px!important;padding:4px 8px!important}body .chat-body{padding:12px!important}body .msg-bubble{font-size:14px!important;padding:8px 12px!important}body .quick-questions button{font-size:13px!important;padding:6px 12px!important}body .chat-footer{padding:8px 12px!important}body .chat-input{font-size:14px!important;padding:8px 12px!important}body .send-btn,body .clear-btn{font-size:14px!important;padding:6px 12px!important}body .mic-btn{width:32px!important;height:32px!important;font-size:16px!important}body .message{max-width:90%!important}`; document.head.appendChild(style); } if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',apply); else apply(); } })();

document.addEventListener('DOMContentLoaded',function(){
    getEl('sendBtn')?.addEventListener('click',send); getEl('clearBtn')?.addEventListener('click',clearChat); getEl('langBtn')?.addEventListener('click',switchLang);
    getEl('micBtn')?.addEventListener('click',toggleRec); getEl('voiceBtn')?.addEventListener('click',toggleVoice); getEl('fontBtn')?.addEventListener('click',openFontModal);
    getEl('confirmFontBtn')?.addEventListener('click',adjustFont); getEl('enlargeBtn')?.addEventListener('click',()=>selectOpt('enlarge')); getEl('narrowBtn')?.addEventListener('click',()=>selectOpt('narrow'));
    getEl('input')?.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); send(); } });
    getEl('modalMask')?.addEventListener('click',closeFontModal); getEl('fontModal')?.addEventListener('click',e=>e.stopPropagation()); getEl('scaleInput')?.addEventListener('keydown',e=>{ if(e.key==='Enter') adjustFont(); });
    let questions=["高血压怎么预防中风？","中风后吃什么好？","家人中风后怎么照顾？","怎么判断是不是中风？","中风后手脚没力气怎么办？","中风后情绪低落怎么办？","中风康复训练有哪些？","颈动脉斑块需要治疗吗？","中风后可以运动吗？","怎么帮家人做心理疏导？"];
    for(let i=1;i<=10;i++){ let btn=getEl(`quick${i}`); if(btn) btn.addEventListener('click',()=>quickAsk(questions[i-1])); }

    // ===== 头像功能初始化 =====
    bindAvatarControls('patient'); bindAvatarControls('doctor');
    getEl('doctorAvatarClick')?.addEventListener('click',openAvatarModal);
    getEl('patientAvatarClick')?.addEventListener('click',openAvatarModal);
    getEl('avatarModalClose')?.addEventListener('click',closeAvatarModal);
    getEl('avatarModalMask')?.addEventListener('click',e=>{ if(e.target===getEl('avatarModalMask')) closeAvatarModal(); });
    document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeAvatarModal(); });
    getEl('chatBody')?.addEventListener('click',e=>{ if(e.target.closest('.msg-avatar')) openAvatarModal(); });

    // 初始化头像 + 欢迎语
    refreshAvatars();
    clearChat();
});
</script>
</body>
